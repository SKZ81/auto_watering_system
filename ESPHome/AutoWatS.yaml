esphome:
  name: autowats-esp

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Autowtas Fallback Hotspot"
    password: !secret hotspot_password

captive_portal:

logger:
  level: DEBUG
  logs:
    pulse_counter: INFO

ota:
  - platform: esphome
    password: !secret autowats_ota_passaword


# ============================================================
# API
# ============================================================

api:
  encryption:
    key: !secret autowats_api_key

  actions:

    # --------------------------------------------------------
    # Generic dose command
    #
    # type:
    #   0 = water
    #   1 = fertilizer 1
    #   2 = fertilizer 2
    #   3 = fertilizer 3
    #
    # volume_ml is ALWAYS the requested delivered volume.
    # The ESP32 decides how this volume is achieved.
    # --------------------------------------------------------
    - action: start_dose
      variables:
        type: int
        volume_ml: float
      then:
        - script.execute:
            id: start_dose
            dose_type: !lambda 'return type;'
            volume_ml: !lambda 'return volume_ml;'

    # --------------------------------------------------------
    # Irrigation command
    #
    # valve:
    #   1..4
    #
    # volume_ml = requested irrigation volume.
    # --------------------------------------------------------
    - action: start_irrigation
      variables:
        valve: int
        volume_ml: float
      then:
        - script.execute:
            id: start_irrigation
            valve: !lambda 'return valve;'
            volume_ml: !lambda 'return volume_ml;'

    # Stop whatever dosing operation is currently running.
    - action: stop_dose
      then:
        - script.execute:
            id: stop_dose
            status: "EMERGENCY_STOP"
            details: "Stopped from HA API"

# ============================================================
# HARDWARE MAPPING & SENSORS
# ============================================================

external_components:
  - source:
      type: local
      path: components


# ============================================================
# I2C
# ============================================================

i2c:
  sda: GPIO33
  scl: GPIO25
  scan: true
  frequency: 10kHz
  timeout: 10ms


# ============================================================
# MCP23017
# ============================================================

mcp23017:
  - id: 'relay_hub'
    address: 0x20


# ============================================================
# RELAYS
# ============================================================

switch:

  # ----------------------------------------------------------
  # Irrigation valves
  # ----------------------------------------------------------

  - platform: gpio
    name: "Valve 1"
    id: valve_1
    pin:
      mcp23xxx: relay_hub
      number: 9
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Valve 2"
    id: valve_2
    pin:
      mcp23xxx: relay_hub
      number: 1
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Valve 3"
    id: valve_3
    pin:
      mcp23xxx: relay_hub
      number: 8
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Valve 4"
    id: valve_4
    pin:
      mcp23xxx: relay_hub
      number: 0
      mode:
        output: true
      inverted: true


  # ----------------------------------------------------------
  # Pumps
  # ----------------------------------------------------------

  - platform: gpio
    name: "Mix Bowl Pump"
    id: mix_bowl_pump
    pin:
      mcp23xxx: relay_hub
      number: 12
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Clear Water Tank Pump"
    id: clear_water_pump
    pin:
      mcp23xxx: relay_hub
      number: 4
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Fertilizer Pump 1"
    id: fertilizer_pump_1
    pin:
      mcp23xxx: relay_hub
      number: 5
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Fertilizer Pump 2"
    id: fertilizer_pump_2
    pin:
      mcp23xxx: relay_hub
      number: 13
      mode:
        output: true
      inverted: true

  - platform: gpio
    name: "Fertilizer Pump 3"
    id: fertilizer_pump_3
    pin:
      mcp23xxx: relay_hub
      number: 6
      mode:
        output: true
      inverted: true


  # ----------------------------------------------------------
  # Flow sensor power
  # ----------------------------------------------------------

  - platform: gpio
    id: pulse_counter_power
    name: "Pulse Counters Power"
    pin: GPIO32


# ============================================================
# SENSORS
# ============================================================

sensor:

  - platform: uptime
    name: "ESP System Uptime"

  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 5s


  # ----------------------------------------------------------
  # HA flow counter - water tank
  # ----------------------------------------------------------

  - platform: pulse_counter
    pin: GPIO35
    update_interval: 30s
    id: ha_tank_flow_counter

    total:
      unit_of_measurement: 'mL'
      name: 'Water Tank Flow Count'
      filters:
        - multiply: 1.6


  # ----------------------------------------------------------
  # HA flow counter - mixer bowl
  # ----------------------------------------------------------

  - platform: pulse_counter
    pin: GPIO34
    update_interval: 30s
    id: ha_bowl_flow_counter

    total:
      unit_of_measurement: 'mL'
      name: 'Mixer Bowl Flow Count'
      filters:
        - multiply: 0.3


  # ----------------------------------------------------------
  # Fast local water counter
  #
  # Used ONLY for local stop conditions.
  # ----------------------------------------------------------

  - platform: pulse_counter
    pin: GPIO17
    id: local_tank_flow_counter
    internal: true
    update_interval: 100ms

    total:
      id: local_tank_volume
      filters:
        - multiply: 1.6
      internal: true


  # ----------------------------------------------------------
  # Fast local bowl counter
  #
  # Used ONLY for local irrigation stop conditions.
  # ----------------------------------------------------------

  - platform: pulse_counter
    pin: GPIO16
    id: local_bowl_flow_counter
    internal: true
    update_interval: 100ms

    total:
      id: local_bowl_volume
      filters:
        - multiply: 0.3
      internal: true


  # ----------------------------------------------------------
  # Scale
  # ----------------------------------------------------------

  - platform: i2c_scale
    name: "Scale"
    address: 0x17
    update_interval: 15s

    always_on: true

    read_samples: 5
    maintenance_samples: 20

    tare:
      name: "Scale Tare"

    calibration:
      name: "Scale Calibration"
      min_value: -100000
      max_value: 100000
      step: 0.1
      restore_value: true

# ============================================================
# SYSTEM STATUS
# ============================================================

binary_sensor:

  - platform: status
    name: "ESP System Status"

# ============================================================
# OPERATIONAL STATUS
# ============================================================

text_sensor:

  - platform: template
    name: "Autowats Status"
    id: autowats_status
    icon: "mdi:state-machine"
    update_interval: never

  - platform: template
    name: "Autowats Error Description"
    id: autowats_error
    update_interval: never

# ============================================================
# MANUAL PARAMETERS
#
# These are deliberately NOT the internal targets of the
# running operations.
#
# They are simply convenient HA controls for manual operation.
# ============================================================

number:

  # ----------------------------------------------------------
  # Manual water dose
  # ----------------------------------------------------------

  - platform: template
    name: "Manual Water Dose Volume"
    id: manual_water_dose_volume
    unit_of_measurement: "mL"
    min_value: 0
    max_value: 10000
    step: 50
    optimistic: true


  # ----------------------------------------------------------
  # Fertilizer pump calibration
  #
  # Average delivered flow in mL/s.
  # ----------------------------------------------------------

  - platform: template
    name: "Fertilizer Pump 1 Flow"
    id: fertilizer_pump_1_flow
    unit_of_measurement: "mL/s"
    min_value: 0.01
    max_value: 100
    step: 0.01
    optimistic: true
    restore_value: true

  - platform: template
    name: "Fertilizer Pump 2 Flow"
    id: fertilizer_pump_2_flow
    unit_of_measurement: "mL/s"
    min_value: 0.01
    max_value: 100
    step: 0.01
    optimistic: true
    restore_value: true

  - platform: template
    name: "Fertilizer Pump 3 Flow"
    id: fertilizer_pump_3_flow
    unit_of_measurement: "mL/s"
    min_value: 0.01
    max_value: 100
    step: 0.01
    optimistic: true
    restore_value: true


  # ----------------------------------------------------------
  # Manual fertilizer doses
  # ----------------------------------------------------------

  - platform: template
    name: "Manual Fertilizer 1 Dose"
    id: manual_fertilizer_1_volume
    unit_of_measurement: "mL"
    min_value: 0
    max_value: 1000
    step: 1
    optimistic: true

  - platform: template
    name: "Manual Fertilizer 2 Dose"
    id: manual_fertilizer_2_volume
    unit_of_measurement: "mL"
    min_value: 0
    max_value: 1000
    step: 1
    optimistic: true

  - platform: template
    name: "Manual Fertilizer 3 Dose"
    id: manual_fertilizer_3_volume
    unit_of_measurement: "mL"
    min_value: 0
    max_value: 1000
    step: 1
    optimistic: true


  # ----------------------------------------------------------
  # Manual irrigation volume
  # ----------------------------------------------------------

  - platform: template
    name: "Manual Irrigation Volume"
    id: manual_irrigation_volume
    unit_of_measurement: "mL"
    min_value: 0
    max_value: 50000
    step: 100
    optimistic: true


  # ----------------------------------------------------------
  # Manual irrigation valve selection
  # ----------------------------------------------------------

  - platform: template
    name: "Manual Irrigation Valve"
    id: manual_irrigation_valve
    min_value: 1
    max_value: 4
    step: 1
    optimistic: true


# ============================================================
# INTERNAL OPERATION STATE
# ============================================================

globals:

  # ----------------------------------------------------------
  # Operation active
  # ----------------------------------------------------------

  - id: pump_running
    type: bool
    restore_value: no
    initial_value: 'false'


  # ----------------------------------------------------------
  # Current operation type
  #
  # 0 = water
  # 1 = fertilizer 1
  # 2 = fertilizer 2
  # 3 = fertilizer 3
  # 4 = irrigation
  # ----------------------------------------------------------

  - id: dose_type
    type: int
    restore_value: no
    initial_value: '0'


  # ----------------------------------------------------------
  # Requested volume of CURRENT operation.
  #
  # Always expressed in mL.
  # ----------------------------------------------------------

  - id: dose_target_ml
    type: float
    restore_value: no
    initial_value: '0'


  # ----------------------------------------------------------
  # For timed fertilizer operations:
  # duration of current operation in milliseconds.
  # ----------------------------------------------------------

  - id: dose_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'


  # ----------------------------------------------------------
  # Timestamp at which a timed operation started.
  # ----------------------------------------------------------

  - id: dose_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'


  # ----------------------------------------------------------
  # Selected irrigation valve.
  # ----------------------------------------------------------

  - id: irrigation_valve
    type: int
    restore_value: no
    initial_value: '0'


# ============================================================
# INTERNAL STOP COMMAND
# ============================================================

script:

  - id: stop_dose
    mode: restart

    parameters:
      status: string
      details: string

    then:

      # Water pump
      - switch.turn_off: clear_water_pump

      # Fertilizer pumps
      - switch.turn_off: fertilizer_pump_1
      - switch.turn_off: fertilizer_pump_2
      - switch.turn_off: fertilizer_pump_3

      # Irrigation pump
      - switch.turn_off: mix_bowl_pump

      # Irrigation valves
      - switch.turn_off: valve_1
      - switch.turn_off: valve_2
      - switch.turn_off: valve_3
      - switch.turn_off: valve_4

      # Flow sensor power is no longer needed.
      - switch.turn_off: pulse_counter_power

      - lambda: |-
          id(pump_running) = false;
          id(dose_target_ml) = 0;
          id(dose_duration_ms) = 0;
          id(autowats_status).publish_state(status);
          id(autowats_error).publish_state(details);

# ============================================================
# WATER DOSING
#
# volume_ml = desired delivered water volume.
#
# The local GPIO17 counter is reset and used as the stop
# condition.
# ============================================================

  - id: start_water_dose
    mode: single

    parameters:
      volume_ml: float

    then:

      # Refuse to start another operation while one is active.
      - if:
          condition:
            lambda: |-
              return id(autowats_status).state != "IDLE" &&
                     id(autowats_status).state != "DONE";
          then:
            - logger.log:
                level: WARN
                format: "Cannot start water dose: another dose is already running."

          else:

            # Store the INTERNAL target.
            - lambda: |-
                id(dose_type) = 0;
                id(dose_target_ml) = volume_ml;

            # Reset the local tank pulse counter.
            - pulse_counter.set_total_pulses:
                id: local_tank_flow_counter
                value: 0

            # Preserve the delay from the original prototype.
            - delay: 150ms

            - lambda: |-
                id(pump_running) = true;
                id(autowats_status).publish_state("RUNNING");
                id(autowats_error).publish_state("");

            - switch.turn_on: pulse_counter_power
            - switch.turn_on: clear_water_pump


# ============================================================
# FERTILIZER DOSING
#
# The API still specifies a volume in mL.
#
# Internally:
#
#     duration_ms = volume_ml / flow_ml_per_second * 1000
#
# No flow meter is required for fertilizer.
# ============================================================

  - id: start_fertilizer_dose
    mode: single

    parameters:
      pump: int
      volume_ml: float

    then:

      - if:
          condition:
            lambda: |-
              return id(autowats_status).state != "IDLE" &&
                     id(autowats_status).state != "DONE";
          then:
            - logger.log:
                level: WARN
                format: "Cannot start fertilizer dose: another dose is already running."

          else:

            - lambda: |-
                float flow = 0.0f;

                if (pump == 1)
                  flow = id(fertilizer_pump_1_flow).state;
                else if (pump == 2)
                  flow = id(fertilizer_pump_2_flow).state;
                else if (pump == 3)
                  flow = id(fertilizer_pump_3_flow).state;

                id(dose_type) = pump;
                id(dose_target_ml) = volume_ml;

                if (flow > 0.0f) {
                  id(dose_duration_ms) =
                      (uint32_t)((volume_ml / flow) * 1000.0f);
                } else {
                  id(dose_duration_ms) = 0;
                }

                id(dose_start_ms) = millis();

            - if:
                condition:
                  lambda: |-
                    return id(dose_duration_ms) > 0;
                then:

                  - lambda: |-
                      id(pump_running) = true;
                      id(autowats_status).publish_state("RUNNING");
                      id(autowats_error).publish_state("");
                  - if:
                      condition:
                        lambda: |-
                          return pump == 1;
                      then:
                        - switch.turn_on: fertilizer_pump_1

                  - if:
                      condition:
                        lambda: |-
                          return pump == 2;
                      then:
                        - switch.turn_on: fertilizer_pump_2

                  - if:
                      condition:
                        lambda: |-
                          return pump == 3;
                      then:
                        - switch.turn_on: fertilizer_pump_3

                else:

                  - logger.log:
                      level: ERROR
                      format: "Cannot start fertilizer dose: invalid/zero pump calibration."


# ============================================================
# IRRIGATION
#
# valve = 1..4
#
# Opens the requested valve AND starts the dedicated
# Mix Bowl Pump.
#
# Volume is measured using the local bowl flow counter.
# ============================================================

  - id: start_irrigation
    mode: single

    parameters:
      valve: int
      volume_ml: float

    then:

      - if:
          condition:
            lambda: |-
              return id(autowats_status).state != "IDLE" &&
                     id(autowats_status).state != "DONE";
          then:
            - logger.log:
                level: WARN
                format: "Cannot start irrigation: another dose is already running."

          else:

            # Store operation state.
            - lambda: |-
                id(dose_type) = 4;
                id(dose_target_ml) = volume_ml;
                id(irrigation_valve) = valve;

            # Reset local bowl counter.
            - pulse_counter.set_total_pulses:
                id: local_bowl_flow_counter
                value: 0

            # Preserve the same startup delay philosophy.
            - delay: 150ms

            - lambda: |-
                id(pump_running) = true;
                id(autowats_status).publish_state("RUNNING");
                id(autowats_error).publish_state("");

            - switch.turn_on: pulse_counter_power

            # Select/open the requested valve.
            - if:
                condition:
                  lambda: |-
                    return valve == 1;
                then:
                  - switch.turn_on: valve_1

            - if:
                condition:
                  lambda: |-
                    return valve == 2;
                then:
                  - switch.turn_on: valve_2

            - if:
                condition:
                  lambda: |-
                    return valve == 3;
                then:
                  - switch.turn_on: valve_3

            - if:
                condition:
                  lambda: |-
                    return valve == 4;
                then:
                  - switch.turn_on: valve_4

            # Dedicated irrigation pump.
            - switch.turn_on: mix_bowl_pump


# ============================================================
# GENERIC DOSE DISPATCHER
#
# This is the abstraction used by the API:
#
#     start_dose(type, volume_ml)
#
# The caller never needs to know whether the physical
# implementation is flow-meter based or time based.
# ============================================================

  - id: start_dose
    mode: single

    parameters:
      dose_type: int
      volume_ml: float

    then:

      - if:
          condition:
            lambda: |-
              return dose_type == 0;
          then:
            - script.execute:
                id: start_water_dose
                volume_ml: !lambda 'return volume_ml;'

      - if:
          condition:
            lambda: |-
              return dose_type >= 1 && dose_type <= 3;
          then:
            - script.execute:
                id: start_fertilizer_dose
                pump: !lambda 'return dose_type;'
                volume_ml: !lambda 'return volume_ml;'


# ============================================================
# Reinit status when manually rearmed
# ============================================================

  - id: rearm_status
    mode: single
    then:
      - lambda: |-
          id(autowats_status).publish_state("IDLE");
          id(autowats_error).publish_state("System rearmed.");

# ============================================================
# MANUAL HA CONTROLS
# ============================================================

button:

  # ----------------------------------------------------------
  # Water
  # ----------------------------------------------------------

  - platform: template
    name: "Start Manual Water Dose"

    on_press:
      - script.execute:
          id: start_dose
          dose_type: 0
          volume_ml: !lambda |-
            return id(manual_water_dose_volume).state;


  # ----------------------------------------------------------
  # Fertilizer 1
  # ----------------------------------------------------------

  - platform: template
    name: "Start Manual Fertilizer 1 Dose"

    on_press:
      - script.execute:
          id: start_dose
          dose_type: 1
          volume_ml: !lambda |-
            return id(manual_fertilizer_1_volume).state;


  # ----------------------------------------------------------
  # Fertilizer 2
  # ----------------------------------------------------------

  - platform: template
    name: "Start Manual Fertilizer 2 Dose"

    on_press:
      - script.execute:
          id: start_dose
          dose_type: 2
          volume_ml: !lambda |-
            return id(manual_fertilizer_2_volume).state;


  # ----------------------------------------------------------
  # Fertilizer 3
  # ----------------------------------------------------------

  - platform: template
    name: "Start Manual Fertilizer 3 Dose"

    on_press:
      - script.execute:
          id: start_dose
          dose_type: 3
          volume_ml: !lambda |-
            return id(manual_fertilizer_3_volume).state;


  # ----------------------------------------------------------
  # Irrigation
  # ----------------------------------------------------------

  - platform: template
    name: "Start Manual Irrigation"

    on_press:
      - script.execute:
          id: start_irrigation
          valve: !lambda |-
            return (int) id(manual_irrigation_valve).state;
          volume_ml: !lambda |-
            return id(manual_irrigation_volume).state;


  # ----------------------------------------------------------
  # Emergency/manual stop
  # ----------------------------------------------------------

  - platform: template
    name: "Emergency STOP"

    on_press:
      - script.execute:
          id: stop_dose
          status: "EMERGENCY_STOP"
          details: "Manual Emergency STOP button pressed"

  # ----------------------------------------------------------
  # Rearm status (after errors, emergency stop, ...)
  # ----------------------------------------------------------
  - platform: template
    name: "Rearm"

    on_press:
      - script.execute:
          id: rearm_status

# ============================================================
# LOCAL DOSING CONTROL LOOP
#
# This is deliberately local to the ESP32.
#
# Water:
#   stop on local tank flow counter.
#
# Fertilizer:
#   stop after calibrated duration.
#
# Irrigation:
#   stop on local bowl flow counter.
# ============================================================

interval:

  - interval: 100ms
    then:

      - if:
          condition:
            lambda: |-
              if (id(autowats_status).state != "RUNNING")
                return false;

              // ----------------------------------------------
              // Water
              // ----------------------------------------------
              if (id(dose_type) == 0) {
                return id(local_tank_volume).state >=
                       id(dose_target_ml);
              }

              // ----------------------------------------------
              // Fertilizer
              // ----------------------------------------------
              if (id(dose_type) >= 1 &&
                  id(dose_type) <= 3) {

                return (uint32_t)(millis() -
                                  id(dose_start_ms)) >=
                       id(dose_duration_ms);
              }

              // ----------------------------------------------
              // Irrigation
              // ----------------------------------------------
              if (id(dose_type) == 4) {
                return id(local_bowl_volume).state >=
                       id(dose_target_ml);
              }

              return false;

          then:
            - script.execute:
                id: stop_dose
                status: "DONE"
                details: ""

  # ==========================================================
  # DEBUG
  # ==========================================================

  - interval: 1s
    then:
      - logger.log:
          format: >-
            running=%d type=%d target_ml=%f
            tank_ml=%f bowl_ml=%f duration_ms=%lu
          args:
            - id(pump_running)
            - id(dose_type)
            - id(dose_target_ml)
            - id(local_tank_volume).state
            - id(local_bowl_volume).state
            - id(dose_duration_ms)

